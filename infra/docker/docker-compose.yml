services:
  postgres:
    image: postgres:16-alpine
    container_name: cafex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafex_user
      POSTGRES_PASSWORD: cafex_dev_pass
      POSTGRES_DB: cafex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafex_user -d cafex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
